{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up</title>
  <link rel="stylesheet" href="{% static "styles/loginStyle.css" %}"/>
</head>
<body>

<div class="container">
  <!-- Sign In Form -->
  <div id="signin-form">
    <h2>Sign In</h2>
    <form method="POST" action="">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn">Sign In</button>

      {% if messages %}
  <ul>
    {% for message in messages %}
      <li style="background-color: red;">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
    </form>

    <div class="toggle" onclick="toggleForms()">Don’t have an account? 
      <span style="color: red;"><a href="{% url 'registerPage' %}">Register</a></span>
    </div>
     <div class="back" onclick="toggleForms()"> 
      <a href="{% url 'home-page' %}">Back</a>
    </div>
  </div>
</body>
</html>
{% endblock %}
