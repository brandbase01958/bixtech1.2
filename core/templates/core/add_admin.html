{% load static %}
<head>
    <link rel="stylesheet" href="{% static 'styles/add-adminstyle.css' %}"/>
</head>
 <div class="container">
  <div id="form-container">
    <h2>Register Admin(Or User)</h2>
    
    <form method="POST" action="" enctype="multipart/form-data">
      {% csrf_token %}
      {{ admin_form.as_p }}
      
      <button type="submit" class="btn">Sign Personel</button>

    {% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li class="{{ message.tags }}">
        {{ message }}
      </li>
    {% endfor %}
  </ul>
{% endif %}

    </form>

    <div class="links">
      <p class="toggle">
        Don’t have an account? 
        <a href="{% url 'registerPage' %}">Register</a>
      </p>
      <p class="back">
        <a href="{% url 'home-page' %}">Back</a>
      </p>
    </div>
  </div>
</div>
